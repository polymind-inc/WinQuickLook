name: Build

permissions:
  contents: read

on:
  push:
    branches: [ master ]
    paths:
      - .editorconfig
      - src/**
      - tests/**
      - .github/workflows/build.yml
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master ]
    paths:
      - .editorconfig
      - src/**
      - tests/**
      - .github/workflows/build.yml

env:
  DOTNET_VERSION: 10.0.x

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true

    - name: Use .NET ${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Build solutions
      run: dotnet build .\WinQuickLook.slnx -c Release -p:Platform=x64

    - name: Run test cases
      run: dotnet test .\WinQuickLook.slnx -c Release -p:Platform=x64 --no-build

    - name: Lint C# code
      run: dotnet format .\WinQuickLook.slnx --verify-no-changes --verbosity detailed --no-restore
